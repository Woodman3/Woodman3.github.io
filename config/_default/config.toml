enableGitInfo = true
# Change baseurl before deploy
baseurl = "https://woodman3.github.io"
locale = "zh-CN"

title = "竹木吟"

# Theme i18n support
# Available values: en, fr, id, ja, ko, pt-br, zh, zh-hant-tw, zh-hant-hk, es, de, nl, it, th, el, uk, ar
defaultContentLanguage = "zh"

# Set hasCJKLanguage to true if DefaultContentLanguage is in [zh ja ko]
# This will make .Summary and .WordCount behave correctly for CJK languages.
hasCJKLanguage = true

# Change it to your Disqus shortname before using
disqusShortname = "woodman3"

[pagination]
pagerSize = 10


[frontmatter]
# lastmod = [":fileModTime", "lastmod"]
lastmod=['lastmod', ':git', 'date', 'publishDate']
